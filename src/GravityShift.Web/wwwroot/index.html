<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity Shift</title>
    <!-- Relative base so the build works from any sub-path (itch.io serves games from one). -->
    <base href="./" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="loading-title">GRAVITY SHIFT</div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="hint">A/D walk · Q/E shift gravity · W flip · R restart</div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#10006;</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
