<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- No pinch/double-tap zoom: on phones the game is played with on-screen buttons. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Gravity Shift</title>
    <!-- Relative base so the build works from any sub-path (itch.io serves games from one). -->
    <base href="./" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="loading-title">GRAVITY SHIFT</div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="hint">A/D walk · Q/E shift gravity · W flip · R restart · M mute · no shifting in purple zones</div>

    <!--
        On-screen controls, shown only on touch screens (or with ?touch=1). Each button sends the
        same keydown/keyup a keyboard would (see touch-controls.js), so the game needs no changes
        and several fingers work at once.
    -->
    <div id="touch-controls" aria-hidden="true">
        <div class="cluster walk">
            <button class="touch" data-key="KeyA" aria-label="Walk left">&#9664;</button>
            <button class="touch" data-key="KeyD" aria-label="Walk right">&#9654;</button>
        </div>
        <div class="cluster shift">
            <span class="label">SHIFT</span>
            <button class="touch flip" data-key="KeyW" aria-label="Flip gravity">&#8593;</button>
            <button class="touch left" data-key="KeyQ" aria-label="Left wall becomes the floor">&#8592;</button>
            <button class="touch right" data-key="KeyE" aria-label="Right wall becomes the floor">&#8594;</button>
        </div>
        <div class="cluster system">
            <button class="touch small" data-key="KeyR" aria-label="Restart level">&#8635;</button>
            <button class="touch small" data-key="KeyM" aria-label="Mute sound">&#9834;</button>
            <button class="touch small" id="fullscreen" aria-label="Fullscreen">&#9974;</button>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#10006;</span>
    </div>

    <script src="touch-controls.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
