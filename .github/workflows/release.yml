name: Release

# Builds the itch.io HTML5 build plus self-contained desktop builds.
# On a version tag (v0.1.0, ...) it also publishes a GitHub Release with all of them attached.
# Can also be run manually from the Actions tab (builds only, no GitHub Release).
#
# A tag must point at the current tip of main (verify-tag), so a tag pushed before its PR is
# merged fails fast instead of releasing old code.
#
# Optional itch.io upload: add a BUTLER_API_KEY repository secret
# (https://itch.io/user/settings/api-keys) and an ITCH_GAME repository variable
# such as "your-name/gravity-shift".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Not "VERSION": MSBuild reads environment variables as properties, so VERSION=v0.1.1 would
  # become $(Version) and fail NuGet restore ("'v0.1.1' is not a valid version string").
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Tag must point at the latest main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          bash scripts/verify-release-tag.sh "$RELEASE_VERSION" "${{ github.sha }}" "$main_sha"

  web:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish src/GravityShift.Web -c Release -o artifacts/web
      # Uploaded as a folder: the artifact download is then exactly the zip itch.io wants.
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-shift-web
          path: artifacts/web/wwwroot
          if-no-files-found: error

  desktop:
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: >
          dotnet publish src/GravityShift.Desktop -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=false -o artifacts/publish/${{ matrix.rid }}
      # .zip for Windows, .tar.gz for Linux/macOS so the executable keeps its +x bit.
      - name: Package
        run: bash scripts/package-desktop.sh artifacts/publish/${{ matrix.rid }} ${{ matrix.rid }} "$RELEASE_VERSION" artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-shift-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error
          # Already compressed; skip zipping it again.
          compression-level: 0

  github-release:
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Collect release files
        run: |
          mkdir -p release
          (cd builds/gravity-shift-web && zip -qr "../../release/gravity-shift-${RELEASE_VERSION}-web.zip" .)
          find builds -name 'gravity-shift-*-*.zip' -o -name 'gravity-shift-*-*.tar.gz' | xargs -I{} cp {} release/
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Gravity Shift: Dead Letter Office** (Game Off 2026)

            | Download | Platform |
            |---|---|
            | `gravity-shift-${{ github.ref_name }}-web.zip` | Browser build (unzip and serve `index.html`, or upload to itch.io as HTML) |
            | `gravity-shift-${{ github.ref_name }}-win-x64.zip` | Windows: unzip, run `GravityShift.exe` |
            | `gravity-shift-${{ github.ref_name }}-linux-x64.tar.gz` | Linux: extract, run `./GravityShift` |
            | `gravity-shift-${{ github.ref_name }}-osx-arm64.tar.gz` | macOS (Apple Silicon): extract, run `./GravityShift` |
            | `gravity-shift-${{ github.ref_name }}-osx-x64.tar.gz` | macOS (Intel): extract, run `./GravityShift` |

            The desktop builds are unsigned. On macOS, if Gatekeeper blocks the game, run
            `xattr -dr com.apple.quarantine <extracted-folder>` or allow it under
            System Settings → Privacy & Security.

            Controls: A/D or ←/→ walk · Q/E shift gravity · W/↑/Space flip · R restart · Esc quit

  itch:
    needs: [web, desktop]
    runs-on: ubuntu-latest
    if: ${{ vars.ITCH_GAME != '' }}
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
      # butler wants plain folders; extracting the tarballs restores the +x bit.
      - name: Unpack desktop builds
        run: |
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            mkdir -p "unpacked/$rid"
            for archive in builds/gravity-shift-$rid/*; do
              case "$archive" in
                *.zip) unzip -q "$archive" -d "unpacked/$rid" ;;
                *.tar.gz) tar -xzf "$archive" -C "unpacked/$rid" ;;
              esac
            done
          done
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
      - name: Push to itch.io
        run: |
          ./butler/butler push builds/gravity-shift-web "${{ vars.ITCH_GAME }}:html5"     --userversion "$RELEASE_VERSION"
          ./butler/butler push unpacked/win-x64/*       "${{ vars.ITCH_GAME }}:windows"   --userversion "$RELEASE_VERSION"
          ./butler/butler push unpacked/linux-x64/*     "${{ vars.ITCH_GAME }}:linux"     --userversion "$RELEASE_VERSION"
          ./butler/butler push unpacked/osx-arm64/*     "${{ vars.ITCH_GAME }}:mac-arm"   --userversion "$RELEASE_VERSION"
          ./butler/butler push unpacked/osx-x64/*       "${{ vars.ITCH_GAME }}:mac-intel" --userversion "$RELEASE_VERSION"
